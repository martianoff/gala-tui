name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Bump GALA_VERSION whenever a new gala release ships. gala-tui's master
# typically depends on language-edge fixes that are on gala master before
# the next tag — when CI is red after a workaround removal, the gating
# release is coming.
env:
  GALA_VERSION: "0.100.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GALA CLI
        run: |
          curl -fsSL -o /usr/local/bin/gala \
            "https://github.com/martianoff/gala/releases/download/${GALA_VERSION}/gala-linux-amd64"
          chmod +x /usr/local/bin/gala
          gala version

      # With GALA 0.100.0 the largest package compile peaks at about 16 GB (its
      # generics instantiate heavily), which is the whole runner. Without more
      # memory the step is killed with exit 143 and no error, so add a 16 GB
      # swap file on the runner's spare disk.
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # One Go package compiles at a time: the root and demo packages each
      # need several GB, and built in parallel they exceed the runner.
      - name: Test
        env:
          GOFLAGS: -p=1
        run: gala test
